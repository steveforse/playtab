services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: playtab
      POSTGRES_PASSWORD: playtab
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playtab"]
      interval: 2s
      timeout: 3s
      retries: 20
  web:
    image: ruby:3.4
    working_dir: /app
    command: bash -c "apt-get update -qq && apt-get install --no-install-recommends -y libvips && rm -rf /var/lib/apt/lists/* && bundle install && bundle exec rails db:prepare && rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"
    environment:
      PGHOST: db
      VITE_RUBY_HOST: vite
      VITE_RUBY_PORT: 3036
      VITE_RUBY_AUTO_BUILD: "false"
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    ports:
      - "127.0.0.1:${PLAYTAB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      vite:
        condition: service_started
  vite:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --port 3036"
    environment:
      VITE_RUBY_HOST: 0.0.0.0
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3036:3036"
volumes:
  postgres:
  bundle:
    name: playtab_bundle
  node_modules:
